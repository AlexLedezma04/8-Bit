name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the Zig version from minimum_zig_version in build.zig.zon.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - run: zig build
      - run: zig build test
      # Builds the Linux and Windows release exes, so one runner is enough.
      - if: runner.os == 'Linux'
        run: zig build size
