name: Release

# Push a tag like v1.0.0 and this builds the downloads and publishes them on the
# Releases page: a Windows installer (.msi) and a Linux archive (.tar.gz), each
# for x86_64 and ARM64. The icon, installer and install script are made here, so
# none of them live in the repo. Run it by hand (workflow_dispatch) to test it:
# it builds everything and keeps it as workflow artifacts without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  UPGRADE_CODE: 393f57a7-65dd-41a7-a4ee-43e6d983ba8c

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      - name: Read the version
        run: |
          version=$(sed -n 's/.*\.version = "\(.*\)".*/\1/p' build.zig.zon)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match build.zig.zon version $version" >&2
            exit 1
          fi

      - run: zig build test
      - run: zig build size

      # The launcher icon: the logo's light bars on a dark rounded square, so it
      # shows on light and dark desktops. The Windows exe gets the same icon.
      - name: Make the icon
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          mkdir -p res
          ffmpeg -v error -y -f lavfi -i "color=c=0x1e1f22:s=1024x1024,format=rgba,geq=r='r(X,Y)':g='g(X,Y)':b='b(X,Y)':a='if(gt(hypot(max(abs(X-512)-332,0),max(abs(Y-512)-332,0)),180),0,255)'" \
            -i assets/icons/8bit-logo-dark-mode.png \
            -filter_complex "[1:v]scale=820:820[l];[0:v][l]overlay=102:102:format=auto" -frames:v 1 res/base.png
          for n in 16 32 48 64 128 256 512; do
            ffmpeg -v error -y -i res/base.png -vf "scale=$n:$n:flags=lanczos" res/i$n.png
          done
          python3 - <<'PY'
          import struct
          sizes = [16, 32, 48, 64, 128, 256]
          pngs = [open(f"res/i{n}.png", "rb").read() for n in sizes]
          head = struct.pack("<HHH", 0, 1, len(sizes))
          offset = 6 + 16 * len(sizes)
          body = b""
          for n, png in zip(sizes, pngs):
              head += struct.pack("<BBBBHHII", n % 256, n % 256, 0, 0, 1, 32, len(png), offset + len(body))
              body += png
          open("res/8-bit.ico", "wb").write(head + body)
          PY
          cat > res/8-bit.rc <<RC
          1 ICON "8-bit.ico"
          1 VERSIONINFO
          FILEVERSION ${VERSION//./,},0
          PRODUCTVERSION ${VERSION//./,},0
          BEGIN
            BLOCK "StringFileInfo"
            BEGIN
              BLOCK "040904b0"
              BEGIN
                VALUE "FileDescription", "8-Bit code editor"
                VALUE "ProductName", "8-Bit"
                VALUE "FileVersion", "$VERSION"
                VALUE "ProductVersion", "$VERSION"
                VALUE "LegalCopyright", "Copyright (c) 2026 Alex Ledezma. MIT license."
                VALUE "OriginalFilename", "8-bit.exe"
              END
            END
            BLOCK "VarFileInfo"
            BEGIN
              VALUE "Translation", 0x0409, 1200
            END
          END
          RC

      - name: Build the exes
        run: |
          zig build --release -Dtarget=x86_64-linux-gnu --prefix out/linux-x86_64
          zig build --release -Dtarget=aarch64-linux-gnu --prefix out/linux-aarch64
          zig build --release -Dtarget=x86_64-windows -Dwin-resource=res/8-bit.rc --prefix out/windows-x86_64
          zig build --release -Dtarget=aarch64-windows -Dwin-resource=res/8-bit.rc --prefix out/windows-aarch64

      - name: Write the Linux menu entry and install scripts
        run: |
          mkdir linux-files
          cat > linux-files/8-bit.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=8-Bit
          GenericName=Code Editor
          Comment=A small, fast code editor
          Exec="@BIN@" %F
          Icon=8-bit
          Terminal=false
          Categories=Development;TextEditor;Utility;
          MimeType=text/plain;text/x-csrc;text/x-chdr;text/x-c++src;text/x-python;text/markdown;application/json;application/xml;application/x-shellscript;
          StartupWMClass=8-bit
          Keywords=editor;code;text;programming;
          DESKTOP
          cat > linux-files/install.sh <<'INSTALL'
          #!/bin/sh
          # Installs 8-Bit: the exe, the menu entry and the icon.
          #   ./install.sh                 for you only, into ~/.local (no root needed)
          #   sudo ./install.sh --system   for every user, into /usr/local
          set -eu
          here=$(cd "$(dirname "$0")" && pwd)
          if [ "${1:-}" = "--system" ]; then
              prefix=/usr/local
          elif [ $# -eq 0 ]; then
              prefix=${HOME:?HOME is not set}/.local
          else
              echo "usage: $0 [--system]" >&2
              exit 2
          fi
          if [ ! -f "$here/8-bit" ]; then
              echo "8-bit not found next to install.sh" >&2
              exit 1
          fi
          install -d "$prefix/bin" "$prefix/share/applications" "$prefix/share/icons/hicolor/512x512/apps"
          install -m 755 "$here/8-bit" "$prefix/bin/8-bit"
          install -m 644 "$here/8-bit.png" "$prefix/share/icons/hicolor/512x512/apps/8-bit.png"
          # The full path in Exec works even when ~/.local/bin is not in PATH.
          sed "s|@BIN@|$prefix/bin/8-bit|" "$here/8-bit.desktop" > "$prefix/share/applications/8-bit.desktop"
          chmod 644 "$prefix/share/applications/8-bit.desktop"
          command -v update-desktop-database >/dev/null 2>&1 && update-desktop-database "$prefix/share/applications" || true
          command -v gtk-update-icon-cache >/dev/null 2>&1 && gtk-update-icon-cache -q -t "$prefix/share/icons/hicolor" || true
          echo "8-Bit is installed in $prefix. Find it in your applications menu, or run: $prefix/bin/8-bit"
          case ":$PATH:" in
              *":$prefix/bin:"*) ;;
              *) echo "Note: $prefix/bin is not in your PATH, so the 8-bit command needs its full path." ;;
          esac
          INSTALL
          cat > linux-files/uninstall.sh <<'UNINSTALL'
          #!/bin/sh
          # Removes what install.sh put in place. Your settings in ~/.config/8-bit stay.
          #   ./uninstall.sh                 from ~/.local
          #   sudo ./uninstall.sh --system   from /usr/local
          set -eu
          if [ "${1:-}" = "--system" ]; then
              prefix=/usr/local
          elif [ $# -eq 0 ]; then
              prefix=${HOME:?HOME is not set}/.local
          else
              echo "usage: $0 [--system]" >&2
              exit 2
          fi
          rm -f "$prefix/bin/8-bit" "$prefix/share/applications/8-bit.desktop" \
                "$prefix/share/icons/hicolor/512x512/apps/8-bit.png"
          command -v update-desktop-database >/dev/null 2>&1 && update-desktop-database "$prefix/share/applications" || true
          command -v gtk-update-icon-cache >/dev/null 2>&1 && gtk-update-icon-cache -q -t "$prefix/share/icons/hicolor" || true
          echo "8-Bit is removed from $prefix."
          UNINSTALL
          chmod +x linux-files/*.sh

      - name: Package the Linux archives
        run: |
          mkdir dist
          for arch in x86_64 aarch64; do
            name="8-bit-$VERSION-linux-$arch"
            mkdir "$name"
            cp out/linux-$arch/bin/8-bit linux-files/* res/i512.png LICENSE README.md "$name/"
            mv "$name/i512.png" "$name/8-bit.png"
            tar -czf "dist/$name.tar.gz" "$name"
          done

      - name: Keep what the Windows job needs
        run: |
          mkdir winfiles
          cp res/8-bit.ico LICENSE winfiles/
          cp out/windows-x86_64/bin/8-bit.exe winfiles/8-bit-x64.exe
          cp out/windows-aarch64/bin/8-bit.exe winfiles/8-bit-arm64.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winfiles
          path: winfiles/*

  # The .msi is made with WiX, which runs on Windows.
  msi:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: winfiles
          path: winfiles
      - run: dotnet tool install --global wix --version 5.0.2
      - name: Build the installers
        run: |
          version=$(sed -n 's/.*\.version = "\(.*\)".*/\1/p' build.zig.zon)
          mkdir dist
          for arch in x64 arm64; do
            cp "winfiles/8-bit-$arch.exe" winfiles/8-bit.exe
            cat > installer.wxs <<WXS
          <Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">
            <Package Name="8-Bit" Manufacturer="Alex Ledezma" Version="$version" UpgradeCode="$UPGRADE_CODE" Scope="perMachine">
              <MajorUpgrade DowngradeErrorMessage="A newer version of 8-Bit is already installed." />
              <MediaTemplate EmbedCab="yes" />
              <Icon Id="AppIcon.ico" SourceFile="winfiles/8-bit.ico" />
              <Property Id="ARPPRODUCTICON" Value="AppIcon.ico" />
              <StandardDirectory Id="ProgramFiles64Folder">
                <Directory Id="INSTALLFOLDER" Name="8-Bit">
                  <Component Id="MainExe">
                    <File Id="Exe" Source="winfiles/8-bit.exe" KeyPath="yes" />
                  </Component>
                  <Component Id="License">
                    <File Id="LicenseFile" Source="winfiles/LICENSE" KeyPath="yes" />
                  </Component>
                </Directory>
              </StandardDirectory>
              <StandardDirectory Id="ProgramMenuFolder">
                <Component Id="StartMenu">
                  <Shortcut Id="MenuShortcut" Name="8-Bit" Description="A small, fast code editor" Target="[INSTALLFOLDER]8-bit.exe" WorkingDirectory="INSTALLFOLDER" />
                  <RegistryValue Root="HKLM" Key="Software\8-Bit" Name="installed" Type="integer" Value="1" KeyPath="yes" />
                </Component>
              </StandardDirectory>
              <Feature Id="Main">
                <ComponentRef Id="MainExe" />
                <ComponentRef Id="License" />
                <ComponentRef Id="StartMenu" />
              </Feature>
            </Package>
          </Wix>
          WXS
            wix build installer.wxs -arch "$arch" -o "dist/8-bit-$version-windows-$arch.msi"
          done
          ls -la dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*.msi

  publish:
    if: github.ref_type == 'tag'
    needs: [build, msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          ls -la
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "8-Bit ${GITHUB_REF_NAME#v}" --notes ""
